<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas render harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #atlas-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      #atlas-stats {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 6px 8px;
        font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #d4d4d8;
        background: rgba(9, 9, 11, 0.72);
        border-radius: 4px;
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="atlas-canvas"></canvas>
    <div id="atlas-stats"></div>
    <script type="module" src="/src/dev/renderHarness.ts"></script>
  </body>
</html>
